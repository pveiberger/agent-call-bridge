services:
  bridge:
    environment:
      STT_BASE_URL: http://call-stt:8093/v1
      STT_MODEL: parakeet-tdt-0.6b-v3
      STT_API_KEY: ""
      STT_PROMPT: ""
      STT_FAST_BASE_URL: ""
      STT_WHISPER_SHORT_CONTEXT: "false"
    depends_on:
      call-stt:
        condition: service_healthy
  call-stt:
    profiles: [parakeet]
    build: ./stt/parakeet
    image: agent-call-stt:parakeet
    restart: unless-stopped
    networks: [speech]
    environment:
      STT_HOTWORDS: ${STT_HOTWORDS:-}
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    mem_limit: 2500m
    pids_limit: 128
    logging:
      driver: none
